name: Apply event update

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply events
        run: python3 .github/scripts/apply_events.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/scripts/apply_events.py .github/workflows/apply-event-update.yml
          git commit -m "Add Ezer and Avance events section"
          git push origin HEAD:main
